name: Tia Health
kind: company
description: Tia Health is a Canadian telehealth platform that connects patients with
  licensed Canadian providers - family doctors, nurse practitioners, specialists, and
  naturopaths - for on-demand virtual care by phone, video, and secure messaging. Its
  services span virtual walk-in and family-practice appointments, prescription renewals,
  sick notes, lab requisitions, and mental health therapy (via partner Focus Mental
  Wellness), with visits covered by provincial health plans in Ontario (OHIP), British
  Columbia (MSP), and Alberta (AHCIP) and paid options elsewhere. Tia Health is part
  of the WELL Health Technologies Corp. clinic network, one of the largest outpatient
  networks in Canada. As of this review Tia Health is a consumer-facing virtual-care
  product with no public developer portal, no documented REST/OpenAPI, and no exposed
  HL7 FHIR CapabilityStatement or SMART-on-FHIR configuration; interoperability in the
  Canadian market is stewarded federally through Canada Health Infoway's pan-Canadian
  FHIR (CA Core / CA Baseline) specifications, which this platform does not publicly
  surface.
